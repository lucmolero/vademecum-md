<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>VadeMecum MD — filme de lançamento</title>
  <style>
    @font-face{font-family:Outfit;src:url('/assets/outfit-regular.ttf')}@font-face{font-family:Outfit;src:url('/assets/outfit-medium.ttf');font-weight:500}@font-face{font-family:Outfit;src:url('/assets/outfit-semibold.ttf');font-weight:600}
    :root{font-family:Outfit,Arial,sans-serif;color:#171816;background:#f5f5f1;font-synthesis:none;text-rendering:optimizeLegibility;-webkit-font-smoothing:antialiased}
    *{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden}body{background:#f5f5f1}
    #stage{position:relative;width:100vw;height:100vh;overflow:hidden;background:linear-gradient(112deg,#f7f7f4 0%,#f0f1ed 100%)}
    canvas{position:absolute;inset:0;width:100%;height:100%}
    .brand{position:absolute;left:5.5%;top:7.5%;display:flex;align-items:center;gap:15px;font-size:30px;font-weight:600;letter-spacing:-.055em;opacity:0;transform:translateY(10px);transition:opacity .65s ease,transform .65s cubic-bezier(.2,.8,.2,1)}
    .brand.on{opacity:1;transform:translateY(0)}.mark{display:grid;place-items:center;width:48px;height:48px;border-radius:13px;background:#171816;color:#fff;font-size:32px;line-height:1;font-weight:600}
    .copy{position:absolute;left:5.5%;top:25%;width:43%;max-width:790px;opacity:0;transform:translateY(14px);transition:opacity .7s ease,transform .7s cubic-bezier(.2,.8,.2,1)}
    .copy.on{opacity:1;transform:translateY(0)}.kicker{margin:0 0 22px;color:#117765;font-size:18px;font-weight:500;letter-spacing:.16em;text-transform:uppercase}
    h1{margin:0;white-space:pre-line;font-size:clamp(56px,5.5vw,94px);line-height:.99;letter-spacing:-.07em;font-weight:600}
    .body{max-width:690px;margin:28px 0 0;color:#626660;font-size:clamp(22px,1.65vw,29px);line-height:1.42;white-space:pre-line}
    .foot{position:absolute;left:5.5%;bottom:8%;display:flex;align-items:center;gap:14px;color:#72766f;font-size:16px;letter-spacing:.02em;opacity:0;transition:opacity .7s ease}.foot.on{opacity:1}
    .foot-line{width:130px;height:1px;background:#cbd0c8}.stage-label{position:absolute;left:5.5%;top:6%;z-index:3;padding:12px 18px;border:1px solid #e1e2dd;border-radius:999px;background:#ffffffed;color:#343832;font-size:16px;font-weight:500;letter-spacing:.04em;box-shadow:0 6px 22px #1718160c;opacity:0;transform:translateY(-6px);transition:opacity .45s ease,transform .45s ease}.stage-label.on{opacity:1;transform:translateY(0)}
    video{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#f5f5f1;opacity:0;transition:opacity .6s ease}video.on{opacity:1}
    .chapter-mark{position:absolute;right:5.5%;bottom:6.5%;z-index:3;display:flex;align-items:center;gap:10px;color:#6d726c;font-size:15px;letter-spacing:.08em;text-transform:uppercase;opacity:0;transition:opacity .5s ease}.chapter-mark.on{opacity:1}.dot{width:9px;height:9px;border-radius:50%;background:#117765;box-shadow:0 0 0 6px #1177651a}
    .progress{position:absolute;left:0;bottom:0;height:4px;background:#117765;transform-origin:left;transform:scaleX(0);z-index:5}
  </style>
</head>
<body>
  <main id="stage" aria-label="Filme de apresentação do VadeMecum MD">
    <canvas id="map" aria-hidden="true"></canvas>
    <div class="brand"><span class="mark">V</span><span>vademecum.md</span></div>
    <section class="copy"><p class="kicker"></p><h1></h1><p class="body"></p></section>
    <div class="foot"><span class="foot-line"></span><span>Legislação · leitura · conhecimento</span></div>
    <div class="stage-label"></div><div class="chapter-mark"><span class="dot"></span><span></span></div>
    <video playsinline preload="auto"></video><div class="progress"></div>
  </main>
  <script type="module">
    const qs=new URLSearchParams(location.search);const seconds=(value)=>new Promise(resolve=>setTimeout(resolve,value*1000));
    const canvas=document.querySelector('#map'),ctx=canvas.getContext('2d');const brand=document.querySelector('.brand'),copy=document.querySelector('.copy'),kicker=document.querySelector('.kicker'),title=document.querySelector('h1'),body=document.querySelector('.body'),foot=document.querySelector('.foot'),label=document.querySelector('.stage-label'),mark=document.querySelector('.chapter-mark'),markText=mark.lastElementChild,video=document.querySelector('video'),progress=document.querySelector('.progress');
    const W=1920,H=1080,colors=['#147d69','#bd913e','#526e87','#7e8b79'];let seed=14133;const rand=()=>{seed=(seed*1664525+1013904223)>>>0;return seed/4294967296};const nodes=Array.from({length:86},(_,i)=>({x:1040+rand()*760,y:165+rand()*780,r:i%13===0?5:2.3,p:rand()*Math.PI*2,c:colors[i%colors.length]}));
    function size(){const ratio=Math.min(devicePixelRatio||1,2);canvas.width=W*ratio;canvas.height=H*ratio;ctx.setTransform(ratio,0,0,ratio,0,0)}addEventListener('resize',size);size();
    let animationStart=performance.now();function draw(now){const elapsed=(now-animationStart)/1000;ctx.clearRect(0,0,W,H);const shifted=nodes.map((n,i)=>({x:n.x+Math.sin(elapsed*.34+n.p)*7,y:n.y+Math.cos(elapsed*.29+n.p)*7,r:n.r,p:n.p,c:n.c}));
      for(let i=0;i<shifted.length;i++){const a=shifted[i];for(let j=i+1;j<shifted.length;j++){const b=shifted[j],dx=a.x-b.x,dy=a.y-b.y,d=Math.hypot(dx,dy);if(d<112){ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.strokeStyle=`rgba(91,101,94,${(1-d/112)*.17})`;ctx.lineWidth=1;ctx.stroke()}}}
      shifted.forEach((n,i)=>{const pulse=.5+.5*Math.sin(elapsed*1.4+n.p),radius=n.r+(i%13===0?pulse*2:0);ctx.beginPath();ctx.arc(n.x,n.y,radius,0,Math.PI*2);ctx.fillStyle=n.c;ctx.globalAlpha=i%13===0?.7+pulse*.3:.45;ctx.fill();ctx.globalAlpha=1});
      const center=shifted[39];ctx.beginPath();ctx.arc(center.x,center.y,34+Math.sin(elapsed)*2,0,Math.PI*2);ctx.strokeStyle='rgba(17,119,101,.20)';ctx.lineWidth=1;ctx.stroke();requestAnimationFrame(draw)}requestAnimationFrame(draw);
    const scenes={
      intro:{k:'Uma consulta jurídica com contexto',t:'Da pergunta\nà fonte.',b:'Skill para agentes, acervo versionado e um mapa navegável do conhecimento normativo.'},
      skill:{k:'01  ·  Skill para agentes',t:'A pergunta orienta\na consulta.',b:'Acompanhe uma consulta demonstrativa: identificação estável, conferência do dispositivo e resposta com referência e corte.'},
      library:{k:'02  ·  Biblioteca e Leitor',t:'Do diploma ao\ndispositivo.',b:'Localize uma norma, abra o artigo e confira identificação, data de corte e procedência no próprio Leitor.'},
      graph:{k:'03  ·  Grafo do conhecimento',t:'Normas em\nrelação.',b:'O grafo representa citações normativas como uma rede navegável: pesquise, explore conexões e siga até o texto.'},
      outro:{k:'VadeMecum MD  ·  v1.1.3',t:'Conhecimento em relação.\nFontes à vista.',b:'Instale a skill. Explore a Biblioteca. Siga as relações no grafo e confira a origem.'}
    };
    const captions={skill:'Skill para agentes · exemplo demonstrativo',library:'Biblioteca e Leitor · busca, dispositivo e procedência',graph:'Grafo do conhecimento · relações de citação navegáveis'};
    async function card(name,duration){const scene=scenes[name];video.classList.remove('on');label.classList.remove('on');mark.classList.remove('on');brand.classList.add('on');copy.classList.remove('on');foot.classList.add('on');kicker.textContent=scene.k;title.textContent=scene.t;body.textContent=scene.b;await seconds(.08);copy.classList.add('on');progress.style.transition='none';progress.style.transform='scaleX(0)';await seconds(duration);copy.classList.remove('on');foot.classList.remove('on');brand.classList.remove('on');}
    async function product(name,src){brand.classList.remove('on');copy.classList.remove('on');foot.classList.remove('on');video.src=src;video.load();video.currentTime=0;if(video.readyState<3)await new Promise((resolve,reject)=>{video.addEventListener('canplay',resolve,{once:true});video.addEventListener('error',reject,{once:true})});video.classList.add('on');const text=captions[name];label.textContent=text;label.classList.add('on');markText.textContent=name==='skill'?'01 / 03':name==='library'?'02 / 03':'03 / 03';mark.classList.add('on');progress.style.transition=`transform ${video.duration||1}s linear`;progress.style.transform='scaleX(1)';const ended=new Promise(resolve=>video.addEventListener('ended',resolve,{once:true}));await video.play();console.info(`[film] started ${name} ${video.duration.toFixed(2)}s`);await ended;console.info(`[film] ended ${name}`);label.classList.remove('on');mark.classList.remove('on');video.classList.remove('on');}
    await document.fonts.ready;window.filmReady=true;
    if(qs.has('preview')){await card(qs.get('preview'),3);window.filmFinished=true}else{await card('intro',3.6);await product('skill','/demos/media/consultas-para-agentes.webm');await card('library',2.8);await product('library','/demos/media/biblioteca-e-leitor.webm');await card('graph',2.8);await product('graph','/demos/media/grafo-em-uso.webm');await card('outro',4);window.filmFinished=true}
  </script>
</body>
</html>
