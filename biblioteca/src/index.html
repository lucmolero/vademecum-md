<main id="library">
</main>
<section id="reading" hidden>
<aside id="sidebar"><header class="side-header"><button id="back-library" class="button" aria-label="Biblioteca" title="Biblioteca"><svg><use href="#i-books"/></svg><span>Biblioteca</span></button><div class="spacer"></div><button id="toggle-search" class="button" aria-label="Buscar no documento" title="Buscar"><svg><use href="#i-search"/></svg></button><button id="close-sidebar" class="button" aria-label="Ocultar painel" title="Ocultar painel">×</button></header>
<div class="book-info"><div id="mini-cover" class="mini-cover"></div><div><strong id="title"></strong><small id="author"></small></div></div>
<div id="toc-panel" class="side-panel" role="tabpanel" aria-labelledby="toc-tab"><nav id="toc" aria-label="Sumário"></nav></div>
<div id="search-panel" class="side-panel" role="tabpanel" aria-labelledby="search-tab" hidden><form id="search-form"><label class="search-field"><input id="query" type="search" placeholder="Buscar no documento" aria-label="Buscar no documento"><button class="button" aria-label="Buscar"><svg><use href="#i-search"/></svg></button></label></form><p id="search-status" class="muted" aria-live="polite"></p><div id="results"></div></div>
<div id="marks-panel" class="side-panel" role="tabpanel" aria-labelledby="marks-tab" hidden><div id="marks"></div></div><div id="notes-panel" class="side-panel" role="tabpanel" aria-labelledby="notes-tab" hidden><div id="notes"></div></div>
<div class="side-tabs" role="tablist" aria-label="Navegação do leitor"><button id="toc-tab" role="tab" aria-controls="toc-panel" aria-label="Sumário" aria-selected="true" tabindex="0" title="Conteúdo"><svg><use href="#i-list"/></svg></button><button id="search-tab" role="tab" aria-controls="search-panel" aria-label="Buscar no documento" aria-selected="false" tabindex="-1" title="Buscar"><svg><use href="#i-search"/></svg></button><button id="notes-tab" role="tab" aria-controls="notes-panel" aria-label="Anotações" aria-selected="false" tabindex="-1" title="Anotações"><svg><use href="#i-note"/></svg></button><button id="marks-tab" role="tab" aria-controls="marks-panel" aria-label="Marcadores" aria-selected="false" tabindex="-1" title="Marcadores"><svg><use href="#i-bookmark"/></svg></button></div></aside>
<div class="reader-area"><header class="reader-header"><button id="reader-back-library" class="button reader-back-library" aria-label="Voltar à biblioteca" title="Voltar à biblioteca"><svg><use href="#i-books"/></svg><span>Biblioteca</span></button><button id="show-sidebar" class="button" aria-label="Mostrar sumário e biblioteca" aria-expanded="false" title="Sumário e biblioteca"><svg><use href="#i-panel"/></svg></button><button id="add-mark" class="button" aria-label="Marcar posição" aria-pressed="false" title="Marcar posição"><svg><use href="#i-bookmark"/></svg></button><span id="reader-context" aria-live="polite"></span><div class="spacer"></div><nav class="reader-project-links" aria-label="Links do projeto"><a class="button" href="https://github.com/lucmolero" target="_blank" rel="noopener noreferrer" aria-label="Perfil do Vademecum no GitHub" title="GitHub"><svg><use href="#i-github"/></svg></a><a class="button" href="https://github.com/lucmolero/vademecum-md" target="_blank" rel="noopener noreferrer" aria-label="Repositório Vademecum MD" title="Repositório vademecum-md"><svg><use href="#i-repository"/></svg></a><a class="button" href="https://github.com/lucmolero/biblioteca-leis" target="_blank" rel="noopener noreferrer" aria-label="Repositório Biblioteca Leis" title="Repositório biblioteca-leis"><svg><use href="#i-repository"/></svg></a></nav><nav class="reader-header-actions" aria-label="Ações do documento"><button id="copy-section-link" class="button" title="Copiar link desta seção">Link</button><button id="copy-citation" class="button" title="Copiar citação">Citar</button><button id="show-source" class="button" title="Ver fonte e procedência">Fonte</button><button id="appearance-toggle" class="button" aria-label="Aparência" aria-expanded="false">Aa</button></nav></header><div class="page-padding"><div id="viewport" tabindex="0" aria-label="Conteúdo do documento"></div></div><footer class="reader-footer"><span id="chapter-label"></span><div class="progress-controls"><button id="previous" class="button" aria-label="Página anterior"><svg><use href="#i-prev"/></svg></button><input id="progress" type="range" min="0" max="1" step="0.001" value="0" aria-label="Progresso de leitura"><button id="next" class="button" aria-label="Próxima página"><svg><use href="#i-next"/></svg></button></div><span id="page-label"></span></footer></div>
</section>
<div id="appearance" class="popover" hidden><strong>Aparência</strong><div class="theme-options"><button data-theme="light">Claro</button><button data-theme="sepia">Sépia</button><button data-theme="dark">Escuro</button><button data-theme="auto">Auto</button></div><label>Tamanho<input id="font-size" type="range" min="14" max="32" step="1" value="18"></label><label>Entrelinha<input id="line-height" type="range" min="1.2" max="2.2" step="0.1" value="1.6"></label><label>Fonte<select id="font"><option value="serif">Serifada</option><option value="sans-serif">Sem serifa</option></select></label><label>Leitura<select id="flow"><option value="scroll" selected>Rolagem</option><option value="pages">Paginada</option></select></label><label>Movimento<select id="motion"><option value="full">Completo</option><option value="calm">Calmo</option></select></label></div>
<div id="selection-popover" class="popover selection-popover" hidden><blockquote id="selected-text"></blockquote><textarea id="note-text" rows="3" placeholder="Anotação opcional" aria-label="Anotação"></textarea><div><button id="save-note">Destacar</button><button id="cancel-note">Cancelar</button></div></div>
<dialog id="source-dialog" aria-labelledby="source-title"><form method="dialog"><button class="button" aria-label="Fechar">×</button></form><h2 id="source-title">Fonte e procedência</h2><div id="source-details"></div></dialog>
<div id="status" role="status" aria-live="polite" aria-atomic="true" hidden><span id="status-message"></span><button class="toast-dismiss" type="button" aria-label="Dispensar aviso" title="Fechar aviso"><svg><use href="#i-close"/></svg></button><span class="toast-progress" aria-hidden="true"><span class="toast-progress-fill"></span></span></div>
