site_name: VadeMecum MD
site_description: Legislação federal brasileira estruturada para leitura humana, validação auditável e uso por máquinas.
site_url: https://lucmolero.github.io/vademecum-md/
repo_url: https://github.com/lucmolero/vademecum-md
repo_name: lucmolero/vademecum-md
docs_dir: site_docs
hooks:
  - site_docs/hooks.py
validation:
  nav:
    omitted_files: ignore
theme:
  name: material
  language: pt-BR
  logo: assets/brand-mark.svg
  favicon: assets/brand-mark.svg
  features:
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.tracking
    - search.highlight
    - search.suggest
    - search.share
    - content.code.copy
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: amber
      toggle:
        icon: material/weather-sunny
        name: Usar tema escuro
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: amber
      toggle:
        icon: material/weather-night
        name: Usar tema claro
  font: false
extra_css:
  - stylesheets/extra.css
  - stylesheets/launch.css
extra_javascript:
  - javascripts/portfolio.js
  - javascripts/reader.js
extra:
  generator: false
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/lucmolero/vademecum-md
nav:
  - Início: index.md
  - Leitor integral: reader/index.md
  - Catálogo: generated/catalog.md
  - Como usar: audiences.md
  - Metodologia:
      - Visão geral: methodology.md
      - Arquitetura: architecture.md
      - Contrato dos documentos: contract.md
      - Auditoria jurídica: legal-audit.md
      - Grafo normativo: graph.md
      - Fontes oficiais: sources.md
      - Exemplos de consumo: examples.md
      - Qualidade: quality.md
      - Atualizações: updates.md
  - Projeto e transparência:
      - Visão do projeto: portfolio.md
      - Proveniência: provenance.md
      - Segurança: security.md
      - Acessibilidade: accessibility.md
      - Limites jurídicos: legal-limits.md
  - Governança:
      - Contribuição: contributing.md
      - Releases e arquivos: generated/laws/index.md
  - Perguntas frequentes: faq.md
