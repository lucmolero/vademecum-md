[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vademecum-md"
version = "1.1.2"
description = "Corpus autoral de legislação federal brasileira em Markdown"
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.12",
    "PyYAML>=6.0",
    "pypdf>=6.0",
]

[project.optional-dependencies]
docs = ["mkdocs>=1.6.1,<2", "mkdocs-material[imaging]>=9.7.7,<10"]

[project.scripts]
vademecum = "vademecum_md.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py312"
