[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vademecum-md"
version = "0.1.0"
description = "Corpus autoral de legislação federal brasileira em Markdown"
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.12",
    "PyYAML>=6.0",
    "pypdf>=6.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py312"
