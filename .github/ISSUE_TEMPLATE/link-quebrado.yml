name: Relatar link quebrado
description: Informe um link do site ou corpus que falha ou aponta para o destino errado.
title: "Link quebrado: "
body:
  - type: markdown
    attributes:
      value: |
        Use este formulário para links quebrados ou destinos incorretos na publicação. Não inclua dados pessoais ou informações sigilosas.
  - type: input
    id: link_publicado
    attributes:
      label: Link com problema
      description: URL exata que falha ou aponta para o destino incorreto.
      placeholder: "https://..."
    validations:
      required: true
  - type: input
    id: release
    attributes:
      label: Release consultada
      placeholder: "v1.1.2"
    validations:
      required: true
  - type: textarea
    id: comportamento
    attributes:
      label: O que acontece ao abrir o link?
      description: Informe o erro observado ou o destino inesperado e, se possível, o destino correto.
      render: text
    validations:
      required: true
