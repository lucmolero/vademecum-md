name: weekly-completeness

on:
  schedule:
    - cron: "7 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  completeness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install project dependencies
        run: python -m pip install -e .
      - name: Rebuild completeness data
        run: python tools/build_public_indexes.py --apply
      - name: Validate editorial matrix synchronization
        run: python tools/validate/sync_editorial_matrix.py
      - name: Audit normative graph
        run: python tools/relations/audit_normative_graph.py
      - name: Classify unresolved relations
        run: python tools/relations/classify_unresolved.py
      - name: Validate public completeness
        run: python tools/validate_release.py
      - name: Run test suite
        run: python -m unittest discover -s tests -v
