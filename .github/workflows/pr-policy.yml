name: trusted-pull-request-policy

on:
  workflow_run:
    workflows: [quality]
    types: [completed]

permissions:
  # The merge endpoint requires contents: write; the workflow never checks out PR code.
  contents: write
  pull-requests: write

jobs:
  enforce-policy:
    if: >-
      github.event.workflow_run.event == 'pull_request' ||
      (github.event.workflow_run.event == 'workflow_dispatch' && startsWith(github.event.workflow_run.head_branch, 'automation/update-'))
    runs-on: ubuntu-latest
    steps:
      - name: Accept owner, Dependabot, and repository update publisher
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}
          RUN_EVENT: ${{ github.event.workflow_run.event }}
          RUN_BRANCH: ${{ github.event.workflow_run.head_branch }}
          CHECKED_SHA: ${{ github.event.workflow_run.head_sha }}
          QUALITY_RESULT: ${{ github.event.workflow_run.conclusion }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ "$RUN_EVENT" == "workflow_dispatch" ]]; then
            if [[ "$RUN_BRANCH" != automation/update-* ]]; then
              echo "Ignoring manual quality run outside the repository's update namespace"
              exit 0
            fi
            PR_NUMBER=$(gh pr list --repo "$GH_REPOSITORY" --head "$RUN_BRANCH" \
              --state open --json number --jq '.[0].number // empty')
            if [[ -z "$PR_NUMBER" ]]; then
              echo "No open proposal PR for dispatched branch $RUN_BRANCH"
              exit 0
            fi
          fi

          pr_json=$(gh pr view "$PR_NUMBER" --repo "$GH_REPOSITORY" \
            --json state,isDraft,baseRefName,headRefOid,author,mergeStateStatus)
          state=$(jq -r '.state' <<< "$pr_json")
          author=$(jq -r '.author.login' <<< "$pr_json")

          if [[ "$state" != "OPEN" ]]; then
            exit 0
          fi

          # github-actions[bot] is allowed only for PRs created by this repository's
          # autonomous legislation publisher; its exact-text provenance is CI-gated.
          if [[ "$author" != "lucmolero" && "$author" != "dependabot[bot]" && "$author" != "app/dependabot" && "$author" != "github-actions[bot]" ]]; then
            gh pr close "$PR_NUMBER" --repo "$GH_REPOSITORY" \
              --comment "Este repositório aceita alterações de lucmolero e do Dependabot. Para relatar problemas, use as issues públicas."
            exit 0
          fi

          is_draft=$(jq -r '.isDraft' <<< "$pr_json")
          base=$(jq -r '.baseRefName' <<< "$pr_json")
          head_sha=$(jq -r '.headRefOid' <<< "$pr_json")
          merge_state=$(jq -r '.mergeStateStatus' <<< "$pr_json")

          if [[ "$is_draft" == "true" || "$base" != "main" || "$head_sha" != "$CHECKED_SHA" ]]; then
            exit 0
          fi

          if [[ "$QUALITY_RESULT" != "success" ]]; then
            exit 0
          fi

          if [[ "$merge_state" == "BEHIND" ]]; then
            gh pr update-branch "$PR_NUMBER" --repo "$GH_REPOSITORY" --rebase
            exit 0
          fi

          gh pr merge "$PR_NUMBER" --repo "$GH_REPOSITORY" --squash
