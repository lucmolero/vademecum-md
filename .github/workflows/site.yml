name: site

on:
  push:
    branches: [main]
  repository_dispatch:
    types: [publish-pages]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  webkit:
    uses: ./.github/workflows/browser-webkit.yml

  build:
    needs: webkit
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"
      - name: Install documentation dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e ".[docs]"
      - name: Generate documentation from the canonical corpus
        run: python tools/site/build_site.py
      - name: Build documentation pages
        run: mkdocs build --strict
      - name: Package the agent skill and matching corpus release
        run: python tools/package_skill_kit.py
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            homepage/package-lock.json
            biblioteca/package-lock.json
      - name: Install homepage dependencies
        run: npm ci
        working-directory: homepage
      - name: Install library dependencies
        run: npm ci
        working-directory: biblioteca
      - name: Test library build and reader logic
        run: npm test
        working-directory: biblioteca
      - name: Build homepage
        run: npm run build
        working-directory: homepage
      - name: Test graph geometry and rendering lifecycle
        run: npm run test:graph
        working-directory: homepage
      - name: Build library from this release's canonical Markdown
        working-directory: biblioteca
        env:
          VADE_REF: ${{ github.ref_name }}
          VADE_COMMIT: ${{ github.sha }}
          VADE_CORPUS_DIR: ${{ github.workspace }}/bases/curated/legislacao/federal
          VADE_RELEASE_FILE: ${{ github.workspace }}/manifests/release.json
        run: npm run build
      - name: Compose and validate Pages site
        env:
          VADE_COMMIT: ${{ github.sha }}
        run: python tools/site/compose_pages.py --site site
      - name: Validate composed routes and release alignment
        run: python tools/validate/validate_pages.py --site site
      - name: Install Chromium for release smoke tests
        run: npx playwright install --with-deps chromium
        working-directory: homepage
      - name: Verify browser journeys and WCAG in Chromium
        timeout-minutes: 8
        run: npm run test:e2e -- --project=chromium
        working-directory: homepage
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: site
      - name: Preserve failed browser diagnostics
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: chromium-pages-diagnostics
          path: homepage/test-results/
          retention-days: 14
          if-no-files-found: ignore

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
