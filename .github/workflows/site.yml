name: site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"
      - name: Install documentation dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e ".[docs]"
      - name: Generate documentation from the canonical corpus
        run: python tools/site/build_site.py
      - name: Build documentation pages
        run: mkdocs build --strict
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            homepage/package-lock.json
            biblioteca/package-lock.json
      - name: Install homepage dependencies
        run: npm ci
        working-directory: homepage
      - name: Install library dependencies
        run: npm ci
        working-directory: biblioteca
      - name: Test library build and reader logic
        run: npm test
        working-directory: biblioteca
      - name: Build homepage
        run: npm run build
        working-directory: homepage
      - name: Build library from this release's canonical Markdown
        working-directory: biblioteca
        env:
          VADE_REF: ${{ github.ref_name }}
          VADE_COMMIT: ${{ github.sha }}
          VADE_CORPUS_DIR: ${{ github.workspace }}/bases/curated/legislacao/federal
          VADE_RELEASE_FILE: ${{ github.workspace }}/manifests/release.json
        run: npm run build
      - name: Compose and validate Pages site
        env:
          VADE_COMMIT: ${{ github.sha }}
        run: python tools/site/compose_pages.py --site site
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
