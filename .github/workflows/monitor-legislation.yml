name: monitor-legislation

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
  repository_dispatch:
    types: [monitor-legislation]

permissions:
  contents: read

concurrency:
  group: legislation-monitor
  cancel-in-progress: true

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"
      - name: Install project dependencies
        run: python -m pip install -e .
      - name: Build freshness report
        run: python tools/acquire/monitor_legislation.py --report reports/legislation-monitor.json
      - name: Publish monitoring artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: legislation-monitor
          path: reports/legislation-monitor.json
          if-no-files-found: error
