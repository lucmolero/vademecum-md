name: monitor-legislation

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
  repository_dispatch:
    types: [monitor-legislation]

permissions:
  contents: read

concurrency:
  group: legislation-monitor
  cancel-in-progress: true

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install project dependencies
        run: python -m pip install -e .
      - name: Build freshness report
        run: python tools/acquire/monitor_legislation.py --report reports/legislation-monitor.json
      - name: Publish monitoring artifact
        uses: actions/upload-artifact@v7
        with:
          name: legislation-monitor
          path: reports/legislation-monitor.json
          if-no-files-found: error
