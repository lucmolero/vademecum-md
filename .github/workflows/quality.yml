name: quality

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 3 1 */3 *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  webkit:
    uses: ./.github/workflows/browser-webkit.yml

  quality:
    needs: webkit
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"
      - name: Install project dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e ".[docs]"
      - name: Compile tools
        run: python -m compileall -q tools tests
      - name: UTF-8 Markdown validation
        run: python tools/check_markdown.py
      - name: Workflow security policy
        run: python tools/validate/validate_workflows.py
      - name: Validate editorial expansion inventory
        run: python tools/validate/audit_editorial_expansion.py
      - name: Generate derived indexes
        run: python tools/build_public_indexes.py --apply
      - name: Build public baseline
        run: python tools/validate/build_baseline.py
      - name: Validate editorial matrix synchronization
        run: python tools/validate/sync_editorial_matrix.py
      - name: Audit normative graph
        run: python tools/relations/audit_normative_graph.py --strict
      - name: Audit normative fidelity contract
        run: python tools/audit_fidelity.py --output bases/derived/relatorios/fidelity-audit-ci.json
      - name: Build reader site
        run: python tools/site/build_site.py
      - name: Render MkDocs site
        run: mkdocs build --strict
      - name: Package the agent skill and matching corpus release
        run: python tools/package_skill_kit.py
      - name: Documentation accessibility baseline
        run: python tools/validate/validate_site.py
      - name: Validate reader site inputs
        run: test -f mkdocs.yml && test -f site_docs/generated/catalog.md
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            homepage/package-lock.json
            biblioteca/package-lock.json
      - name: Install homepage dependencies
        run: npm ci
        working-directory: homepage
      - name: Install library dependencies
        run: npm ci
        working-directory: biblioteca
      - name: Test library build and reader logic
        run: npm test
        working-directory: biblioteca
      - name: Build homepage
        run: npm run build
        working-directory: homepage
      - name: Test graph geometry and rendering lifecycle
        run: npm run test:graph
        working-directory: homepage
      - name: Build library from the checked-out Markdown release
        working-directory: biblioteca
        env:
          VADE_REF: ${{ github.ref_name }}
          VADE_COMMIT: ${{ github.sha }}
          VADE_CORPUS_DIR: ${{ github.workspace }}/bases/curated/legislacao/federal
          VADE_RELEASE_FILE: ${{ github.workspace }}/manifests/release.json
        run: npm run build
      - name: Compose the complete Pages tree
        env:
          VADE_COMMIT: ${{ github.sha }}
        run: python tools/site/compose_pages.py --site site
      - name: Validate homepage, library and release alignment
        run: python tools/validate/validate_pages.py --site site
      - name: Install Chromium for homepage and reader browser tests
        run: npx playwright install --with-deps chromium
        working-directory: homepage
      - name: Verify browser journeys and WCAG in Chromium
        timeout-minutes: 8
        run: npm run test:e2e -- --project=chromium
        working-directory: homepage
      - name: Classify unresolved relations
        run: python tools/relations/classify_unresolved.py
      - name: Public release gates
        run: python tools/validate_release.py --stabilization
      - name: Test suite
        run: python -m unittest discover -s tests -v
      - name: Preserve failed browser diagnostics
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: chromium-quality-diagnostics
          path: homepage/test-results/
          retention-days: 14
          if-no-files-found: ignore
