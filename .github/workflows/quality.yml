name: quality

on:
  push:
  pull_request:
  schedule:
    - cron: "17 3 1 */3 *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install project dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e ".[docs]"
      - name: Compile tools
        run: python -m compileall -q tools tests
      - name: UTF-8 Markdown validation
        run: python tools/check_markdown.py
      - name: Workflow security policy
        run: python tools/validate/validate_workflows.py
      - name: Validate editorial expansion inventory
        run: python tools/validate/audit_editorial_expansion.py
      - name: Generate derived indexes
        run: python tools/build_public_indexes.py --apply
      - name: Build public baseline
        run: python tools/validate/build_baseline.py
      - name: Validate editorial matrix synchronization
        run: python tools/validate/sync_editorial_matrix.py
      - name: Audit normative graph
        run: python tools/relations/audit_normative_graph.py --strict
      - name: Audit normative fidelity contract
        run: python tools/audit_fidelity.py --output bases/derived/relatorios/fidelity-audit-ci.json
      - name: Build reader site
        run: python tools/site/build_site.py
      - name: Prepare pinned social-card fonts
        run: python tools/site/prepare_social_fonts.py
      - name: Render MkDocs site
        run: mkdocs build --strict
        env:
          CI: "true"
      - name: Accessibility baseline
        run: python tools/validate/validate_site.py
        env:
          VMD_REQUIRE_SOCIAL_CARDS: "1"
      - name: Enforce rendered site transfer budgets
        run: python tools/validate/validate_site_budget.py
      - name: Validate reader site inputs
        run: test -f mkdocs.yml && test -f site_docs/generated/catalog.md
      - name: Classify unresolved relations
        run: python tools/relations/classify_unresolved.py
      - name: Public release gates
        run: python tools/validate_release.py --stabilization
      - name: Test suite
        run: python -m unittest discover -s tests -v
