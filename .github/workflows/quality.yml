name: quality

on:
  push:
  pull_request:
  schedule:
    - cron: "17 3 1 */3 *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install project dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e .
      - name: Compile tools
        run: python -m compileall -q tools tests
      - name: UTF-8 Markdown validation
        run: python tools/check_markdown.py
      - name: Workflow security policy
        run: python tools/validate/validate_workflows.py
      - name: Generate derived indexes
        run: python tools/build_public_indexes.py --apply
      - name: Validate editorial matrix synchronization
        run: python tools/validate/sync_editorial_matrix.py
      - name: Audit normative graph
        run: python tools/relations/audit_normative_graph.py
      - name: Classify unresolved relations
        run: python tools/relations/classify_unresolved.py
      - name: Public release gates
        run: python tools/validate_release.py
      - name: Test suite
        run: python -m unittest discover -s tests -v
