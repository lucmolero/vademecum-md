name: prepare-update-pr

on:
  workflow_dispatch:
  repository_dispatch:
    types: [prepare-update-pr]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: legislation-update-proposal
  cancel-in-progress: false

jobs:
  proposal:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install project dependencies
        run: python -m pip install -e .
      - name: Collect candidate snapshots
        run: python tools/acquire/collect_legislation.py --mode proposal --report reports/legislation-collection.json
      - name: Build candidate structural diffs
        run: python tools/history/build_candidate_diffs.py --collection-report reports/legislation-collection.json --output reports/legislation-diffs --source-resolution manifests/source-resolution.json
      - name: Prepare autonomous update proposal
        id: proposal
        shell: bash
        run: |
          stamp=$(date -u +%Y%m%dT%H%M%SZ)
          python tools/release/prepare_update_pr.py \
            --mode proposal \
            --collection-report reports/legislation-collection.json \
            --output reports/legislation-update-proposal.json \
            --diff-index reports/legislation-diffs/index.json \
            --diff-dir reports/legislation-diffs \
            --source-resolution manifests/source-resolution.json \
            --proposal-markdown "docs/proposals/update-${stamp}.md"
          if [ -f manifests/legal-consensus.json ]; then
            python tools/legal/validate_consensus.py manifests/legal-consensus.json
            python tools/legal/generate_consensus.py \
              --collection-report reports/legislation-collection.json \
              --source-resolution manifests/source-resolution.json \
              --priority P0 \
              --apply
            python tools/reconcile/apply_reviewed_updates.py \
              --mode apply_reviewed \
              --collection-report reports/legislation-collection.json \
              --output reports/reviewed-update-application.json \
              --source-resolution manifests/source-resolution.json \
              --legal-consensus manifests/legal-consensus.json \
              --priority P0
          else
            echo "No autonomous curator/critic consensus ledger; preserving current corpus and publishing evidence only."
          fi
          python tools/build_public_indexes.py --apply
          python tools/audit_fidelity.py \
            --report reports/legislation-collection.json \
            --report reports/editorial-expansion-collection-v2.json \
            --output bases/derived/relatorios/fidelity-audit.json
          python tools/migrate_fidelity_contract.py --audit bases/derived/relatorios/fidelity-audit.json --apply
          python tools/build_public_indexes.py --apply
          python tools/audit_fidelity.py \
            --report reports/legislation-collection.json \
            --report reports/editorial-expansion-collection-v2.json \
            --output bases/derived/relatorios/fidelity-audit.json
          python tools/validate_release.py --stabilization
          if [ -z "$(git status --porcelain -- docs/proposals)" ]; then
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Create update branch and autonomous PR
        if: steps.proposal.outputs.has_changes == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          base_branch="${{ github.event.repository.default_branch }}"
          if [ -z "$base_branch" ]; then
            echo "Unable to resolve repository default branch" >&2
            exit 1
          fi
          git fetch --no-tags origin "$base_branch"
          git checkout -B "$base_branch" "origin/$base_branch"
          branch="automation/update-${GITHUB_RUN_ID}"
          if [ "$branch" = "$base_branch" ]; then
            echo "Refusing to write to the default branch" >&2
            exit 1
          fi
          git config user.name "vademecum-md automation"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add docs/proposals bases/curated manifests bases/derived/relacoes bases/derived/relatorios
          git commit -m "chore: prepare legislation update proposal"
          git push origin "$branch"
          proposal_file=$(find docs/proposals -maxdepth 1 -type f -name 'update-*.md' | sort | tail -n 1)
          pr_url=$(gh pr create --base "$base_branch" --head "$branch" \
            --title "chore: legislation update proposal" \
            --body-file "$proposal_file")
          gh pr merge "$pr_url" --auto --squash --delete-branch=false
      - name: Upload non-sensitive proposal report
        uses: actions/upload-artifact@v4
        with:
          name: legislation-update-proposal
          path: |
            reports/legislation-collection.json
            reports/legislation-update-proposal.json
          if-no-files-found: error
