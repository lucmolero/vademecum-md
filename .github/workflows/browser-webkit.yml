name: WebKit browser checks

on:
  workflow_call:

permissions:
  contents: read

jobs:
  webkit:
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - name: Build library
        working-directory: biblioteca
        run: |
          npm ci
          npm run build
      - name: Install homepage dependencies and WebKit
        working-directory: homepage
        run: |
          npm ci
          npx playwright install webkit
      - name: Verify WebKit journeys and WCAG
        working-directory: homepage
        run: npm run test:e2e -- --project=webkit
      - name: Preserve failed browser diagnostics
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: webkit-diagnostics
          path: homepage/test-results/
          retention-days: 14
          if-no-files-found: ignore
