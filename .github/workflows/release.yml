name: release-gates

on:
  schedule:
    - cron: "41 5 1 1,4,7,10 *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install project dependencies
        run: python -m pip install -e .
      - name: Validate editorial expansion inventory
        run: python tools/validate/audit_editorial_expansion.py
      - name: Rebuild deterministic derived data
        run: python tools/build_public_indexes.py --apply
      - name: Build public baseline
        run: python tools/validate/build_baseline.py
      - name: Validate editorial matrix synchronization
        run: python tools/validate/sync_editorial_matrix.py
      - name: Audit normative graph
        run: python tools/relations/audit_normative_graph.py --strict
      - name: Validate committed normative fidelity ledger
        run: >-
          python -c "import json; p=json.load(open('bases/derived/relatorios/fidelity-audit.json', encoding='utf-8'));
          assert p.get('schema') == 'normative-fidelity-audit/v1';
          assert p.get('status') == 'pass';
          assert p.get('corpus_count') == 375;
          assert p.get('counts', {}).get('pass') == 375"
      - name: Classify unresolved relations
        run: python tools/relations/classify_unresolved.py
      - name: Validate release gates
        run: python tools/validate_release.py
      - name: Build reader site inputs
        run: python tools/site/build_site.py
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Build public release package
        run: python tools/release/build_release.py --mode release --output dist
      - name: Generate CycloneDX SBOM
        run: python tools/release/build_sbom.py --output dist/sbom.cdx.json
      - name: Generate release checksums
        working-directory: dist
        run: sha256sum * > SHA256SUMS.txt
      - name: Upload release package
        uses: actions/upload-artifact@v7
        with:
          name: vademecum-md-release
          path: dist/*
          if-no-files-found: error

  publish:
    if: needs.release-gates.result == 'success'
    needs: release-gates
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Download release package
        uses: actions/download-artifact@v4
        with:
          name: vademecum-md-release
          path: dist
      - name: Publish GitHub release autonomously
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(python -c "import json; print(json.load(open('dist/release-manifest.json', encoding='utf-8'))['version'])")
          if gh release view "v${version}" >/dev/null 2>&1; then
            echo "Release v${version} already exists; refreshing reproducibility assets."
            gh release upload "v${version}" \
              dist/vademecum-md-"${version}".zip \
              dist/sbom.cdx.json \
              dist/release-manifest.json \
              dist/SHA256SUMS.txt \
              --clobber
          else
            gh release create "v${version}" \
              dist/vademecum-md-"${version}".zip \
              dist/sbom.cdx.json \
              dist/release-manifest.json \
              dist/SHA256SUMS.txt \
              --title "vademecum-md ${version}" \
              --notes-file dist/CHANGELOG.md \
              --target "${GITHUB_SHA}"
          fi
